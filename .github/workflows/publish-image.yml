name: Publish image

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      source_ref: ${{ steps.capture_ref.outputs.source_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - name: Install Python and dependencies
        run: |
          uv python install 3.14
          uv sync --frozen --all-groups
      - name: Test
        run: uv run pytest -q
      - name: Lint Python
        run: uv run ruff check .
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Capture source ref
        id: capture_ref
        env:
          SOURCE_REF: ${{ github.ref }}
        run: echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"
  publish:
    needs: checks
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Show image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Published digest $IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"

  context_summary:
    needs: checks
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Print the event and transferred ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ needs.checks.outputs.source_ref }}
        run: |
          echo "event=$EVENT_NAME"
          echo "source_ref=$SOURCE_REF"
