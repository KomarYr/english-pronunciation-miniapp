services:
  web:
    build: .
    image: azure-mini-app:local
    env_file:
      - .env
    environment:
      MINIAPP_HOST: 0.0.0.0
    ports:
      - "8080:8000" # for laptop, "127.0.0.1:8000:8000" - for Caddy
    volumes:
      - ama_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
volumes:
  ama_data: