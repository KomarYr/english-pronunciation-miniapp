[project]
name = "azure-mini-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KomarYr", email = "komar.yr@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "azure-cognitiveservices-speech>=1.53.0",
    "dotenv>=0.9.9",
    "fastapi>=0.115.0",
    "langdetect>=1.0.9",
    "uvicorn>=0.30.0",
]

[project.scripts]
azure-mini-app-telegram = "azure_mini_app.interactions.telegram:main"
azure-mini-app-web = "azure_mini_app.interactions.miniapp.web:main"
azure-mini-app-dev = "azure_mini_app.devtools:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
