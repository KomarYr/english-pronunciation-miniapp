[project]
name = "speech-project-azure"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KomarYr", email = "komar.yr@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "azure-cognitiveservices-speech>=1.53.0",
    "dotenv>=0.9.9",
    "langdetect>=1.0.9",
]

[project.scripts]
speech-project-azure = "speech_project_azure.interactions.cli:main"
speech-project-telegram = "speech_project_azure.interactions.telegram:main"
speech-project-azure-demo = "speech_project_azure.recognizer:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "ty>=0.0.99",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
